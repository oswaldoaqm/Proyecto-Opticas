# Verifica en cada push y pull request que el proyecto se reproduce desde cero
# en Linux y en Windows: instala el entorno fijado, corre las pruebas de la
# fisica, regenera todas las figuras y ejecuta los notebooks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproducir:
    name: Reproducir (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar el entorno fijado
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Pruebas de la fisica
        run: pytest

      - name: Regenerar todas las figuras
        run: python scripts/generar_figuras.py

      - name: Ejecutar los notebooks de principio a fin
        run: jupyter nbconvert --to notebook --execute notebooks/*.ipynb --output-dir "$RUNNER_TEMP/notebooks"
