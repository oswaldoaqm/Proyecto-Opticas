# Verifica en cada push y pull request que el proyecto se reproduce desde cero
# en Linux y en Windows: instala el entorno fijado, corre las pruebas de la
# fisica, regenera todas las figuras (tambien las del poster) y ejecuta los notebooks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproducir:
    name: Reproducir (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20      # si algo se cuelga, el trabajo se corta aqui (GitHub espera hasta 6 horas)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar el entorno fijado
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Pruebas de la fisica
        run: pytest

      - name: Regenerar todas las figuras
        run: python scripts/generar_figuras.py

      - name: Regenerar las figuras del poster
        # -W error::UserWarning: falla si a la fuente le falta un caracter (en Windows,
        # Arial no tiene el subindice de k0 y saldria un recuadro en la figura).
        run: python -W error::UserWarning poster/generar_poster.py --figuras

      - name: Ejecutar los notebooks de principio a fin
        # Ninguna celda tarda mas de unos segundos; el limite de 2 minutos evita esperas sin fin.
        run: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=120 notebooks/*.ipynb --output-dir "$RUNNER_TEMP/notebooks"
