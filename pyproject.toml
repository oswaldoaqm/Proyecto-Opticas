[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lentes"
version = "0.1.0"
description = "Trazado vectorial de rayos en lentes gruesas: formación de imágenes y aberración esférica (Óptica & Ondas, UTEC, Grupo 1)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Diego Gabriel Atoche Rodriguez" },
  { name = "Angel Manuel Farro Jurado" },
  { name = "Fernando André Guillén Rodriguez" },
  { name = "Oswaldo Alejandro Quispe Monzón" },
]
dependencies = ["numpy", "scipy", "matplotlib", "sympy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
